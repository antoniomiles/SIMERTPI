spring:
  application:
    name: simertpi-backend

  lifecycle:
    timeout-per-shutdown-phase: ${SIMERTPI_SHUTDOWN_TIMEOUT:30s}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: simertpi-backend

simertpi:
  dev-seed:
    enabled: ${SIMERTPI_DEV_SEED_ENABLED:false}
  auth:
    access-ttl: ${SIMERTPI_AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${SIMERTPI_AUTH_REFRESH_TTL:30d}
  parking:
    rules:
      time-zone: ${SIMERTPI_PARKING_TIME_ZONE:America/Guayaquil}
  control:
    scheduler:
      enabled: ${SIMERTPI_CONTROL_SCHEDULER_ENABLED:true}
      fixed-delay-ms: 60000
  payments:
    provider: ${SIMERTPI_PAYMENT_PROVIDER:UNCONFIGURED}
    sandbox:
      enabled: ${SIMERTPI_PAYMENT_SANDBOX_ENABLED:false}
    # Future HTTP adapters must require explicit connect/read timeouts.
    pending-timeout:
      enabled: ${SIMERTPI_PENDING_TIMEOUT_ENABLED:false}
      # minutes must be supplied explicitly when enabled.
  outbox:
    max-attempts: ${SIMERTPI_OUTBOX_MAX_ATTEMPTS:3}
    backoff-seconds: ${SIMERTPI_OUTBOX_BACKOFF_SECONDS:30}
    processing-timeout-seconds: ${SIMERTPI_OUTBOX_PROCESSING_TIMEOUT_SECONDS:300}
  reconciliation:
    payments:
      enabled: ${SIMERTPI_PAYMENT_RECONCILIATION_ENABLED:false}
      fixed-delay-ms: ${SIMERTPI_PAYMENT_RECONCILIATION_DELAY_MS:60000}
    evidence:
      enabled: ${SIMERTPI_EVIDENCE_RECONCILIATION_ENABLED:false}
      fixed-delay-ms: ${SIMERTPI_EVIDENCE_RECONCILIATION_DELAY_MS:300000}
    outbox:
      enabled: ${SIMERTPI_OUTBOX_RECOVERY_ENABLED:false}
      fixed-delay-ms: ${SIMERTPI_OUTBOX_RECOVERY_DELAY_MS:60000}
  notifications:
    providers:
      push: ${SIMERTPI_NOTIFICATION_PUSH_PROVIDER:UNCONFIGURED}
      whatsapp: ${SIMERTPI_NOTIFICATION_WHATSAPP_PROVIDER:UNCONFIGURED}
      email: ${SIMERTPI_NOTIFICATION_EMAIL_PROVIDER:UNCONFIGURED}
    sandbox:
      enabled: ${SIMERTPI_NOTIFICATION_SANDBOX_ENABLED:false}
    dispatcher:
      enabled: ${SIMERTPI_NOTIFICATION_DISPATCHER_ENABLED:true}
    outbox:
      enabled: ${SIMERTPI_OUTBOX_ENABLED:true}
      fixed-delay-ms: 5000
    reminders:
      fixed-delay-ms: 60000
  evidence:
    storage:
      enabled: true
      base-path: ${SIMERTPI_EVIDENCE_STORAGE_BASE_PATH:${java.io.tmpdir}/simertpi-evidence}
      max-file-size-bytes: 10485760
      allowed-media-types:
        - image/jpeg
        - image/png
        - application/pdf
    retry:
      fixed-delay-ms: 60000

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
