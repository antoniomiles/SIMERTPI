# Keep integration tests deterministic; processors are invoked explicitly.
# Fail closed if an integration test forgets the common container infrastructure.
# DynamicPropertySource replaces these values; DEV datasource is never a fallback.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
simertpi.evidence.storage.base-path=${simertpi.qa.storage-path}
simertpi.payments.pending-timeout.enabled=false
simertpi.reconciliation.payments.enabled=false
simertpi.reconciliation.evidence.enabled=false
simertpi.reconciliation.outbox.enabled=false
simertpi.notifications.outbox.enabled=false

spring.profiles.active=test
simertpi.payments.provider=SANDBOX_STUB
simertpi.payments.sandbox.enabled=true
simertpi.payments.sandbox.outcome=PENDING

simertpi.notifications.dispatcher.enabled=false
